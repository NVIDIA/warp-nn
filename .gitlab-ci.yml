include:
  - project: "omniverse/devplat/gitlab/templates/common/compliance"
    file: "modules/omniverse-repo-compliance.gitlab-ci.yml"
    ref: v1_latest

workflow:
  auto_cancel:
    on_new_commit: interruptible

# Define stages
stages:
  - build
  - test
  - coverage
  - benchmark
  - security
  - deploy

# Define variables
variables:
  PYTHON_VERSION: "3.10"
  DOCS_DIR: "docs"
  BUILD_DIR: "docs/_build/html"
  OSEC_SONARQUBE_ENABLED: "true"  # disabled by default in the compliance template

# ========================================================================================
# Security stage (jobs defined by the compliance template)
# ========================================================================================

# The template places its jobs in the "test" stage unless this base is overridden
.osec:stage_base:
  stage: security

# The template runs these jobs automatically only on the default/protected branches and tags, leaving them as manual
# jobs in merge requests. Override their rules to run them automatically in merge requests too.
osec:pulse-trufflehog:
  rules:
    - if: $OSEC_PULSE_TRUFFLEHOG_ENABLED != 'true'
      when: never
    - if: $CI_MERGE_REQUEST_IID || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_REF_PROTECTED == "true" || $CI_COMMIT_TAG
      when: always
    - when: never

osec:sonarqube:
  rules:
    - if: $OSEC_SONARQUBE_ENABLED != 'true'
      when: never
    - if: $CI_MERGE_REQUEST_IID || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_REF_PROTECTED == "true"
      when: always
    - when: never

# ========================================================================================
# Build stage
# ========================================================================================

# Build documentation
build-docs:
  stage: build
  interruptible: true
  image: python:${PYTHON_VERSION}
  tags:
    - os/linux
  before_script:
    - pip install --upgrade pip
    - pip install -e .[docs]
  script:
    - cd ${DOCS_DIR}
    - sphinx-build -b html -W --keep-going . _build/html
    - cd ..
  artifacts:
    paths:
      - ${BUILD_DIR}
    expire_in: 1 hour
  only:
    - main
    - master
    - develop
    - tags
    - merge_requests

# ========================================================================================
# Test stage
# ========================================================================================

# Unit tests, split into parallel jobs to speed up the CI: one job for each of the slowest test folders and one job
# for the remaining tests (all the tests except the folders of the other jobs, so that new tests are always run).
# When adding a job for a folder, also add the folder to the --ignore options of the "other" job (otherwise its tests
# run twice). PYTEST_ARGS is expanded unquoted by the shell, so it may hold several arguments.
test-pytest:
  stage: test
  needs: []
  interruptible: true
  # each job takes a few minutes: fail a stuck job (e.g. a runner that stopped responding) early and retry it once
  timeout: 30m
  retry:
    max: 1
    when:
      - stuck_or_timeout_failure
      - runner_system_failure
  image: python:${PYTHON_VERSION}
  tags:
    - os/linux
  parallel:
    matrix:
      - TEST_SUITE: modules-activations
        PYTEST_ARGS: "tests/modules/activations"
      - TEST_SUITE: modules-layers
        PYTEST_ARGS: "tests/modules/layers"
      - TEST_SUITE: modules-operators
        PYTEST_ARGS: "tests/modules/operators"
      - TEST_SUITE: runtime
        PYTEST_ARGS: "tests/runtime"
      - TEST_SUITE: other  # all the remaining tests
        PYTEST_ARGS: "tests
          --ignore=tests/modules/activations
          --ignore=tests/modules/layers
          --ignore=tests/modules/operators
          --ignore=tests/runtime"
  variables:
    # one coverage data file per job, combined by the coverage-report job
    COVERAGE_FILE: .coverage.${TEST_SUITE}
  before_script:
    - pip install --upgrade pip
    - python -m pip install --quiet torch
    - pip install -e .[tests]
  script:
    # the coverage percentage of each job is partial: the total is reported by the coverage-report job
    - pytest ${PYTEST_ARGS}
        --junitxml=pytest-report.xml
        --cov=warp_nn --cov-report=
  artifacts:
    when: always  # upload the reports even if tests fail
    paths:
      - .coverage.*  # coverage data, only used by the coverage-report job
    reports:
      junit: pytest-report.xml
    expire_in: 1 day
  only:
    - main
    - develop
    - tags
    - merge_requests

# Test documentation build
test-docs:
  stage: test
  needs: []
  interruptible: true
  image: python:${PYTHON_VERSION}
  tags:
    - os/linux
  before_script:
    - pip install --upgrade pip
    - pip install -e .[docs]
  script:
    - cd ${DOCS_DIR}
    - sphinx-build -b html -W . _build/html  # build with warnings as errors to catch issues
    - echo "Documentation build test passed!"
  only:
    - merge_requests

# ========================================================================================
# Coverage stage
# ========================================================================================

# Combine the coverage of the test-pytest jobs and report the total coverage (in the MR) and the Cobertura report
# (for the MR diff). It runs even if some tests failed, as long as all the jobs uploaded their coverage data
coverage-report:
  stage: coverage
  needs:
    - job: test-pytest
      artifacts: true
  when: always
  interruptible: true
  image: python:${PYTHON_VERSION}
  tags:
    - os/linux
  before_script:
    # toml: reads the coverage configuration from pyproject.toml (Python < 3.11)
    - pip install --quiet "coverage[toml]>=7.10"
  script:
    # fail if a test-pytest job did not upload its coverage data (e.g. it failed before running the tests), rather
    # than reporting a partial (falsely low) total coverage
    - |
      expected=$(grep -cE '^[[:space:]]*(-[[:space:]]*)?PYTEST_ARGS:' .gitlab-ci.yml)
      found=$(ls .coverage.* 2>/dev/null | wc -l)
      echo "Coverage data files: ${found} of ${expected}"
      if [ "${found}" -ne "${expected}" ]; then
        echo "ERROR: missing coverage data from some test-pytest jobs"
        exit 1
      fi
    - coverage combine .coverage.*
    - coverage report
    - coverage xml -o coverage.xml
  # extract the total coverage percentage (from the terminal report) to display it in the MR
  coverage: '/^TOTAL.*\s+(\d+(?:\.\d+)?%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 30 days
  only:
    - main
    - develop
    - tags
    - merge_requests

# ========================================================================================
# Benchmark stage
# ========================================================================================

# Benchmark the modules (vs PyTorch and vs the baseline branch) and expose the reports (HTML, Markdown, JSON and CSV)
# in the merge request (exposed artifact). Report only: it does not block merging.
# It runs on a GPU runner. In merge requests, the eager modules benchmark runs when the library, the benchmarks, the
# project configuration or the CI configuration change; the checkboxes of the merge request description control the
# other benchmarks and the options (see .gitlab/merge_request_templates/Default.md):
#   - [x] Run benchmarks against baseline -> compare the modules against the baseline branch (checked by default in the
#                                            template; only an unchecked box disables it, passing --no-baseline)
#   - [ ] Run benchmarks against PyTorch  -> compare the modules against PyTorch (unchecked by default in the template;
#                                            only an unchecked box disables it, passing --no-pytorch). With both
#                                            boxes unchecked, no benchmark job runs (including the Newton ones).
#                                            The Newton benchmark always compares against PyTorch (it has no baseline)
#   - [ ] Run benchmarks in robust mode   -> pass --robust to all the benchmarks (slower, randomized memory placement)
#   - [ ] Run CUDA-graph benchmarks       -> run the CUDA graph mode of the modules benchmark (and of the Newton
#                                            benchmark, if enabled), regardless of the changed files
#   - [ ] Run Newton benchmarks           -> run the Newton actuator networks benchmark, regardless of the changed files
# The checkboxes are read when the pipeline is created: after editing the description, run a new pipeline.
# GitLab only exposes the first 2700 characters of the description to the CI (the template lists the checkboxes first).
# The rule regexes (RE2) and the grep patterns (ERE) below match the same "- [x] <label>" lines: keep them in sync.
# On direct commits to the main branches, all the benchmarks are available on demand (manual).

# Rule fragments of the benchmark jobs
.benchmark-rules:
  # merge requests with both comparisons disabled ("Run benchmarks against baseline" and "Run benchmarks against
  # PyTorch" checkboxes explicitly unchecked): skip all the benchmark jobs (listed first in their rules)
  no-comparison:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DESCRIPTION =~ /(^|\n)[ \t]*[-*+][ \t]*\[[ \t]\][ \t]+Run benchmarks against baseline[ \t]*(\r?\n|$)/ && $CI_MERGE_REQUEST_DESCRIPTION =~ /(^|\n)[ \t]*[-*+][ \t]*\[[ \t]\][ \t]+Run benchmarks against PyTorch[ \t]*(\r?\n|$)/'
      when: never
  # merge requests that change the benchmarked code
  merge-request-changes:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &benchmark-changes
        - warp_nn/**/*
        - benchmarks/**/*
        - pyproject.toml
        - .gitlab-ci.yml
  # direct commits to the main branches: available on demand (manual), without blocking the pipeline
  manual-on-main-branches:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
      changes: *benchmark-changes
      when: manual
      allow_failure: true

# Warn when the description is truncated (the checkboxes after the first 2700 characters are not seen). Best effort:
# only printed by the benchmark jobs that were created
.benchmark-description-check:
  before_script:
    - |
      if [ "${CI_MERGE_REQUEST_DESCRIPTION_IS_TRUNCATED:-}" = "true" ]; then
        echo "WARNING: the merge request description is truncated, checkboxes after its first 2700 characters are ignored"
      fi

# Robust mode: enabled by the "Run benchmarks in robust mode" checkbox of the merge request description
# (checked with grep rather than with rules, since it applies on top of whichever rule selected the job)
.benchmark-robust-mode:
  before_script:
    - |
      if printf '%s\n' "${CI_MERGE_REQUEST_DESCRIPTION:-}" \
          | grep -E '^[[:space:]]*[-*+][[:space:]]*\[[xX]\][[:space:]]+Run benchmarks in robust mode[[:space:]]*$' > /dev/null; then
        echo "Robust mode enabled (merge request description checkbox)"
        export BENCHMARK_ARGS="${BENCHMARK_ARGS} --robust"
      fi

# Comparisons of the modules benchmark, against the baseline branch and against PyTorch: each one is disabled only by
# an explicitly unchecked "Run benchmarks against baseline" or "Run benchmarks against PyTorch" checkbox of the merge
# request description (a description without the checkbox keeps it enabled). With both boxes unchecked, the benchmark
# jobs are not created (see the no-comparison rule)
.benchmark-comparisons:
  before_script:
    - |
      unchecked() {
        printf '%s\n' "${CI_MERGE_REQUEST_DESCRIPTION:-}" \
          | grep -E "^[[:space:]]*[-*+][[:space:]]*\[[[:space:]]\][[:space:]]+$1[[:space:]]*$" > /dev/null
      }
      if unchecked "Run benchmarks against baseline"; then
        echo "Baseline comparison disabled (merge request description checkbox)"
        export BENCHMARK_ARGS="${BENCHMARK_ARGS} --no-baseline"
      else
        # the baseline implementation is exported from the baseline branch (not fetched by merge request pipelines),
        # fetched as a local branch so that the report columns are labeled with its name (e.g. "Forward vs develop")
        git fetch --quiet --depth=1 origin "+${BENCHMARK_BASELINE_REF}:${BENCHMARK_BASELINE_REF}"
        if unchecked "Run benchmarks against PyTorch"; then
          echo "PyTorch comparison disabled (merge request description checkbox)"
          export BENCHMARK_ARGS="${BENCHMARK_ARGS} --no-pytorch"
        fi
      fi

# Base of the benchmark jobs: each job sets the execution mode (BENCHMARK_ARGS) and its own output directory
.benchmark-modules:
  stage: benchmark
  needs: []
  interruptible: true
  allow_failure: true
  timeout: 2h
  image: python:${PYTHON_VERSION}
  tags:
    - os/linux
  variables:
    BENCHMARK_BASELINE_REF: develop
    BENCHMARK_ARGS: ""
  before_script:
    - nvidia-smi
    - pip install --upgrade pip
    - python -m pip install --quiet torch
    - pip install -e .[tests]
    - !reference [.benchmark-description-check, before_script]
    - !reference [.benchmark-comparisons, before_script]
    - !reference [.benchmark-robust-mode, before_script]
  script:
    - python -m benchmarks.benchmark_modules
        --baseline-ref "${BENCHMARK_BASELINE_REF}"
        --format markdown html json csv
        --output-dir "${BENCHMARK_OUTPUT_DIR}"
        ${BENCHMARK_ARGS}
  artifacts:
    when: always
    expire_in: 30 days
  rules:
    - !reference [.benchmark-rules, no-comparison]
    - !reference [.benchmark-rules, merge-request-changes]
    - !reference [.benchmark-rules, manual-on-main-branches]

# Eager mode (includes the host/launch overhead)
benchmark-modules-eager:
  extends: .benchmark-modules
  variables:
    BENCHMARK_OUTPUT_DIR: benchmark-results-eager
  artifacts:
    expose_as: "Modules benchmark - eager"
    # literal paths (expose_as does not allow variables): keep them in sync with BENCHMARK_OUTPUT_DIR
    paths:
      - benchmark-results-eager/benchmark_modules.html
      - benchmark-results-eager/benchmark_modules.md
      - benchmark-results-eager/benchmark_modules.json
      - benchmark-results-eager/benchmark_modules.csv

# CUDA graph mode (replays captured graphs: no host overhead)
benchmark-modules-cuda-graph:
  extends: .benchmark-modules
  variables:
    BENCHMARK_OUTPUT_DIR: benchmark-results-cuda-graph
    BENCHMARK_ARGS: "--cuda-graph"
  rules:
    - !reference [.benchmark-rules, no-comparison]
    # merge requests: opt-in ("Run CUDA-graph benchmarks" checkbox), regardless of the changed files
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DESCRIPTION =~ /(^|\n)[ \t]*[-*+][ \t]*\[[xX]\][ \t]+Run CUDA-graph benchmarks[ \t]*(\r?\n|$)/'
    - !reference [.benchmark-rules, manual-on-main-branches]
  artifacts:
    expose_as: "Modules benchmark - CUDA graph"
    paths:
      - benchmark-results-cuda-graph/benchmark_modules.html
      - benchmark-results-cuda-graph/benchmark_modules.md
      - benchmark-results-cuda-graph/benchmark_modules.json
      - benchmark-results-cuda-graph/benchmark_modules.csv

# Newton actuator networks vs PyTorch (network inference only)
.benchmark-newton-networks:
  extends: .benchmark-modules
  before_script:
    - nvidia-smi
    - pip install --upgrade pip
    - pip install -e .[tests]
    - !reference [.benchmark-description-check, before_script]
    - !reference [.benchmark-robust-mode, before_script]
  script:
    - python -m benchmarks.benchmark_newton_networks
        --device cuda:0
        --format markdown html json csv
        --output-dir "${BENCHMARK_OUTPUT_DIR}"
        ${BENCHMARK_ARGS}

benchmark-newton-networks-eager:
  extends: .benchmark-newton-networks
  variables:
    BENCHMARK_OUTPUT_DIR: benchmark-results-newton-eager
  rules:
    - !reference [.benchmark-rules, no-comparison]
    # merge requests: opt-in ("Run Newton benchmarks" checkbox), regardless of the changed files
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DESCRIPTION =~ /(^|\n)[ \t]*[-*+][ \t]*\[[xX]\][ \t]+Run Newton benchmarks[ \t]*(\r?\n|$)/'
    - !reference [.benchmark-rules, manual-on-main-branches]
  artifacts:
    expose_as: "Newton networks benchmark - eager"
    paths:
      - benchmark-results-newton-eager/benchmark_newton_networks.html
      - benchmark-results-newton-eager/benchmark_newton_networks.md
      - benchmark-results-newton-eager/benchmark_newton_networks.json
      - benchmark-results-newton-eager/benchmark_newton_networks.csv

benchmark-newton-networks-cuda-graph:
  extends: .benchmark-newton-networks
  variables:
    BENCHMARK_OUTPUT_DIR: benchmark-results-newton-cuda-graph
    BENCHMARK_ARGS: "--cuda-graph"
  rules:
    - !reference [.benchmark-rules, no-comparison]
    # merge requests: opt-in ("Run Newton benchmarks" and "Run CUDA-graph benchmarks" checkboxes)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DESCRIPTION =~ /(^|\n)[ \t]*[-*+][ \t]*\[[xX]\][ \t]+Run Newton benchmarks[ \t]*(\r?\n|$)/ && $CI_MERGE_REQUEST_DESCRIPTION =~ /(^|\n)[ \t]*[-*+][ \t]*\[[xX]\][ \t]+Run CUDA-graph benchmarks[ \t]*(\r?\n|$)/'
    - !reference [.benchmark-rules, manual-on-main-branches]
  artifacts:
    expose_as: "Newton networks benchmark - CUDA graph"
    paths:
      - benchmark-results-newton-cuda-graph/benchmark_newton_networks.html
      - benchmark-results-newton-cuda-graph/benchmark_newton_networks.md
      - benchmark-results-newton-cuda-graph/benchmark_newton_networks.json
      - benchmark-results-newton-cuda-graph/benchmark_newton_networks.csv

# ========================================================================================
# Deploy stage
# ========================================================================================

# Publish Python wheel to package repository
python-publish-wheel:
  stage: deploy
  needs: []
  image: python:${PYTHON_VERSION}
  tags:
    - os/linux
  before_script:
    - pip install --quiet --upgrade pip build twine
  script:
    - python -m build --wheel
    - twine upload --repository-url ${PYTHON_REPOSITORY_URL}
        --username ${PYTHON_REPOSITORY_USERNAME}
        --password ${PYTHON_REPOSITORY_PASSWORD}
        dist/*.whl
  when: manual
  only:
    - main

# Deploy documentation to GitLab Pages
pages:
  stage: deploy
  image: alpine:latest
  tags:
    - os/linux
  needs:
    - build-docs
  script:
    # GitLab Pages requires the output to be in a directory named 'public'
    - rm -rf public
    - mv ${BUILD_DIR} public
    # Create a .nojekyll file to ensure all files are served correctly
    - touch public/.nojekyll
    # Display deployment info
    - echo "Documentation has been built and will be deployed to GitLab Pages"
    - echo "Total files:" $(find public -type f | wc -l)
  artifacts:
    paths:
      - public
  only:
    - main
    - master
