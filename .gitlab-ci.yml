include:
  - project: "omniverse/devplat/gitlab/templates/common/compliance"
    file: "modules/omniverse-repo-compliance.gitlab-ci.yml"
    ref: v1_latest

workflow:
  auto_cancel:
    on_new_commit: interruptible

# Define stages
stages:
  - build
  - test
  - benchmark
  - security
  - deploy

# Define variables
variables:
  PYTHON_VERSION: "3.10"
  DOCS_DIR: "docs"
  BUILD_DIR: "docs/_build/html"
  OSEC_SONARQUBE_ENABLED: "true"  # disabled by default in the compliance template

# ========================================================================================
# Security stage (jobs defined by the compliance template)
# ========================================================================================

# The template places its jobs in the "test" stage unless this base is overridden
.osec:stage_base:
  stage: security

# The template runs these jobs automatically only on the default/protected branches and tags, leaving them as manual
# jobs in merge requests. Override their rules to run them automatically in merge requests too.
osec:pulse-trufflehog:
  rules:
    - if: $OSEC_PULSE_TRUFFLEHOG_ENABLED != 'true'
      when: never
    - if: $CI_MERGE_REQUEST_IID || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_REF_PROTECTED == "true" || $CI_COMMIT_TAG
      when: always
    - when: never

osec:sonarqube:
  rules:
    - if: $OSEC_SONARQUBE_ENABLED != 'true'
      when: never
    - if: $CI_MERGE_REQUEST_IID || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_REF_PROTECTED == "true"
      when: always
    - when: never

# ========================================================================================
# Build stage
# ========================================================================================

# Build documentation
build-docs:
  stage: build
  interruptible: true
  image: python:${PYTHON_VERSION}
  tags:
    - os/linux
  before_script:
    - pip install --upgrade pip
    - pip install -e .[docs]
  script:
    - cd ${DOCS_DIR}
    - sphinx-build -b html -W --keep-going . _build/html
    - cd ..
  artifacts:
    paths:
      - ${BUILD_DIR}
    expire_in: 1 hour
  only:
    - main
    - master
    - develop
    - tags
    - merge_requests

# ========================================================================================
# Test stage
# ========================================================================================

# Unit tests
test-pytest:
  stage: test
  needs: []
  interruptible: true
  image: python:${PYTHON_VERSION}
  tags:
    - os/linux
  before_script:
    - pip install --upgrade pip
    - python -m pip install --quiet torch
    - pip install -e .[tests]
  script:
    - pytest tests/
        --junitxml=pytest-report.xml
        --cov=warp_nn --cov-report=term --cov-report=xml:coverage.xml
  # extract the total coverage percentage (from the terminal report) to display it in the MR
  coverage: '/^TOTAL.*\s+(\d+(?:\.\d+)?%)$/'
  artifacts:
    when: always  # upload the reports even if tests fail
    reports:
      junit: pytest-report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 30 days
  only:
    - main
    - develop
    - tags
    - merge_requests

# Test documentation build
test-docs:
  stage: test
  needs: []
  interruptible: true
  image: python:${PYTHON_VERSION}
  tags:
    - os/linux
  before_script:
    - pip install --upgrade pip
    - pip install -e .[docs]
  script:
    - cd ${DOCS_DIR}
    - sphinx-build -b html -W . _build/html  # build with warnings as errors to catch issues
    - echo "Documentation build test passed!"
  only:
    - merge_requests

# Benchmark the modules (vs PyTorch and vs the baseline branch) and expose the reports (HTML, Markdown, JSON and CSV)
# in the merge request (exposed artifact). Report only: it does not block merging.
# It runs on a GPU runner, only for merge requests that change the library, the benchmarks, the project configuration
# or the CI configuration.
# Base of the benchmark jobs: each job sets the execution mode (BENCHMARK_ARGS) and its own output directory
.benchmark-modules:
  stage: benchmark
  needs: []
  interruptible: true
  allow_failure: true
  timeout: 2h
  image: python:${PYTHON_VERSION}
  tags:
    - os/linux
  variables:
    BENCHMARK_BASELINE_REF: develop
    BENCHMARK_ARGS: ""
  before_script:
    - nvidia-smi
    - pip install --upgrade pip
    - python -m pip install --quiet torch
    - pip install -e .[tests]
    # the baseline implementation is exported from the baseline branch (not fetched by merge request pipelines),
    # fetched as a local branch so that the report columns are labeled with its name (e.g. "Forward vs develop")
    - git fetch --quiet --depth=1 origin "+${BENCHMARK_BASELINE_REF}:${BENCHMARK_BASELINE_REF}"
  script:
    - python -m benchmarks.benchmark_modules
        --baseline-ref "${BENCHMARK_BASELINE_REF}"
        --format markdown html json csv
        --output-dir "${BENCHMARK_OUTPUT_DIR}"
        ${BENCHMARK_ARGS}
  artifacts:
    when: always
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - warp_nn/**/*
        - benchmarks/**/*
        - pyproject.toml
        - .gitlab-ci.yml

# Eager mode (includes the host/launch overhead)
benchmark-modules-eager:
  extends: .benchmark-modules
  variables:
    BENCHMARK_OUTPUT_DIR: benchmark-results-eager
  artifacts:
    expose_as: "Modules benchmark - eager"
    # literal paths (expose_as does not allow variables): keep them in sync with BENCHMARK_OUTPUT_DIR
    paths:
      - benchmark-results-eager/benchmark_modules.html
      - benchmark-results-eager/benchmark_modules.md
      - benchmark-results-eager/benchmark_modules.json
      - benchmark-results-eager/benchmark_modules.csv

# CUDA graph mode (replays captured graphs: no host overhead)
benchmark-modules-cuda-graph:
  extends: .benchmark-modules
  variables:
    BENCHMARK_OUTPUT_DIR: benchmark-results-cuda-graph
    BENCHMARK_ARGS: "--cuda-graph"
  artifacts:
    expose_as: "Modules benchmark - CUDA graph"
    paths:
      - benchmark-results-cuda-graph/benchmark_modules.html
      - benchmark-results-cuda-graph/benchmark_modules.md
      - benchmark-results-cuda-graph/benchmark_modules.json
      - benchmark-results-cuda-graph/benchmark_modules.csv

# ========================================================================================
# Deploy stage
# ========================================================================================

# Publish Python wheel to package repository
python-publish-wheel:
  stage: deploy
  needs: []
  image: python:${PYTHON_VERSION}
  tags:
    - os/linux
  before_script:
    - pip install --quiet --upgrade pip build twine
  script:
    - python -m build --wheel
    - twine upload --repository-url ${PYTHON_REPOSITORY_URL}
        --username ${PYTHON_REPOSITORY_USERNAME}
        --password ${PYTHON_REPOSITORY_PASSWORD}
        dist/*.whl
  when: manual
  only:
    - main

# Deploy documentation to GitLab Pages
pages:
  stage: deploy
  image: alpine:latest
  tags:
    - os/linux
  needs:
    - build-docs
  script:
    # GitLab Pages requires the output to be in a directory named 'public'
    - rm -rf public
    - mv ${BUILD_DIR} public
    # Create a .nojekyll file to ensure all files are served correctly
    - touch public/.nojekyll
    # Display deployment info
    - echo "Documentation has been built and will be deployed to GitLab Pages"
    - echo "Total files:" $(find public -type f | wc -l)
  artifacts:
    paths:
      - public
  only:
    - main
    - master
