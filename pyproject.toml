[project]
name = "warp-nn"
version = "0.3.1"
requires-python = ">=3.10"
description = "Neural network library for NVIDIA Warp"
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [
  {name = "NVIDIA Corporation"},
]
keywords = ["machine-learning", "neural-network", "nvidia", "warp"]
classifiers = [
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "warp-lang>=1.15.0",
]

[project.urls]
Documentation = "https://nvidia.github.io/warp-nn"
Repository = "https://github.com/NVIDIA/warp-nn"
Issues = "https://github.com/NVIDIA/warp-nn/issues"
Changelog = "https://github.com/NVIDIA/warp-nn/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Optional: ONNX policy inference.  Only the pure protobuf parser is needed;
# inference runs on Warp kernels, no `onnxruntime` is pulled in.
onnx = [
  "onnx>=1.16.0",
]
tests = [
  "hypothesis",
  "onnx>=1.16.0",
  "pytest",
  "pytest-cov",
  "torch",
]
docs = [
  "myst-parser",
  "nvidia-sphinx-theme",
  "sphinx-autobuild",
  "sphinx-copybutton",
]

# ---------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["."]
include = ["warp_nn*"]


[tool.black]
line-length = 120
extend-exclude = """
(
  ^/docs
)
"""


[tool.codespell]
# run: codespell <folder>
skip = "./docs/source/_static,./docs/_build,pyproject.toml"
quiet-level = 3
count = true


[tool.isort]
profile = "black"
line_length = 120
lines_after_imports = 2
known_test = [
  "warnings",
  "hypothesis",
  "pytest",
]
known_annotation = ["typing"]
known_framework = [
  "numpy",
  "warp",
]
sections = [
  "FUTURE",
  "ANNOTATION",
  "TEST",
  "STDLIB",
  "THIRDPARTY",
  "FRAMEWORK",
  "FIRSTPARTY",
  "LOCALFOLDER",
]
no_lines_before = "THIRDPARTY"
skip = ["docs"]
